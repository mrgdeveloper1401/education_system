user nginx;
worker_processes auto;

error_log /var/log/nginx/main_error.log error;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on; # accept multi connection
    accept_mutex on; # set to in if nginx worker_proccess > 1
}

http {
     # request body
    client_max_body_size 10M;
    client_body_buffer_size 256k;

    # timeout
    client_body_timeout 120;
    client_header_timeout 120;
    send_timeout 60;
    proxy_connect_timeout 20s; # max time connect nginx into backend
    proxy_send_timeout 30s; # max time send send data, from nginx into backend
    proxy_read_timeout 30s; # max time send data, from backend into nginx

    # basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # proxy settings
    proxy_buffering on; # get backend response after save in buffer afetr send into client
    proxy_request_buffering on; # get all file after send into backend
    proxy_buffer_size 8k; # first bufer size for send response into backend
    proxy_buffers 16 32k; # how many buffer number and buffer size (16 * 32 = 512), save 512kb response backend into memory
    proxy_busy_buffers_size 64k; # send buffer size into cleint

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # Performance Optimizations
    sendfile on; # send file directly from dist into network
    tcp_nopush on; # send all packet (for big request)
    tcp_nodelay on; # send delivery packaet (for small request)
    sendfile_max_chunk 1m;

    # keepalive
    keepalive_timeout 5; # open connection tcp with 5 second
    keepalive_requests 1000; # max number of request in connection

    gzip on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/manifest+json
        text/yaml
        application/yaml;
    gzip_min_length 1000; # compress responses larger then 1000 bytes
    gzip_comp_level 5; # level compressor
    gzip_vary on;
    gzip_proxied any; # compress request if request in proxy or cdn
    gzip_buffers 16 16k; # memory for used gzip
    gzip_http_version 1.1; # enable gzip in http 1.1

    # ریدایرکت تمام درخواست‌ها از HTTP به HTTPS
    server {
        listen 80;
        server_name api.codeima.ir;
        return 301 https://$host$request_uri;
    }

    upstream djangoApp{
        server django:8000;
        keepalive 64; # for 2 core ==> 128 connection
    }

    upstream flowerService{
        server flower:5555;
        keepalive 32; # for 2 core ==> 64 connection
    }

    # پیکربندی سرور با SSL
    server {
        listen 443 ssl;
        server_name api.codeima.ir;

        http2 on;

        ssl_certificate /etc/letsencrypt/fullchain.pem; # certficicate ssl
        ssl_certificate_key /etc/letsencrypt/server.key; # privateKey ssl
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;

        # volume encrypt data
        ssl_buffer_size 8k;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # clinet info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            #send real protocol
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # compatibility
            proxy_set_header X-Scheme $scheme;

            # prevent duplicate send header
            proxy_set_header Early-Data $ssl_early_data;

            # redirects we set the host: header above already
            proxy_redirect off;

            # close connection if user disconnect connecton
            proxy_ignore_client_abort off;

            # send into backend
#             proxy_pass http://django:8000;
              proxy_pass http://djangoApp;
        }

        location /static/ {
            alias /var/www/static/;
            add_header Cache-Control "public, immutable";
            access_log off;
            expires 30d;
        }

    }

    # config flower service
     server {
        listen 443 ssl;
        server_name flower.codeima.ir;

        http2 on;

        ssl_certificate /etc/letsencrypt/fullchain.pem; # certficicate ssl
        ssl_certificate_key /etc/letsencrypt/server.key; # privateKey ssl
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;

        # volume encrypt data
        ssl_buffer_size 8k;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # clinet info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            #send real protocol
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # compatibility
            proxy_set_header X-Scheme $scheme;

            # prevent duplicate send header
            proxy_set_header Early-Data $ssl_early_data;

            # redirects we set the host: header above already
            proxy_redirect off;

            # close connection if user disconnect connecton
            proxy_ignore_client_abort off;

            # send into backend
#             proxy_pass http://django:8000;
              proxy_pass http://flowerService;
        }
    }
}
