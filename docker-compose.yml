services:
  db:
    container_name: education_postgres
    image: docker.arvancloud.ir/postgres:17-alpine
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTDB_PASSWORD}
      - POSTGRES_USER=${POSTDB_USER}
      - POSTGRES_DB=${POSTDB_NAME}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTDB_USER}", "-d", "${POSTDB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  redis:
    container_name: education_redis
    image: docker.arvancloud.ir/redis:8-alpine
    command: >
      redis-server
      --loglevel warning
      --appendonly no
      --save ""
      --maxmemory 1000mb
      --maxmemory-policy allkeys-lru
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 5s

  nginx:
    container_name: education_nginx
    volumes:
      - static_files:/var/www/static
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    build:
      context: dockerfile/prod/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_started

  app:
    container_name: django
    build:
      context: .
      dockerfile: dockerfile/prod/django/Dockerfile
    expose:
      - 8000
    volumes:
      - static_files:/home/app/staticfiles
    env_file: ".env"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    container_name: education_celery
    restart: always
    build:
      context: .
      dockerfile: dockerfile/prod/celery/Dockerfile
    entrypoint: "celery -A base worker -l INFO"
    env_file: ".env"
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
#
#  celery_beat:
#    container_name: education_celery_beat
#    restart: always
#    build:
#      context: .
#      dockerfile: dockerfile/prod/celery/Dockerfile
#    depends_on:
#      celery:
#        condition: service_started
#    entrypoint: "celery -A base beat"
#    env_file: ".env"

  flower:
    container_name: education_flower
    restart: always
    build:
      context: .
      dockerfile: dockerfile/prod/celery/Dockerfile
    depends_on:
      celery:
        condition: service_started
    entrypoint: "celery -A base flower"
    env_file: "env_folder/flower.env"

volumes:
  static_files:
  postgres_data:
